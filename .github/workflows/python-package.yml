# CI: build the package and run the test suite on every push/PR.
# (The publish workflow lives in publish.yml — this file only tests.)

name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # requires-python is ">=3.13", so older interpreters can't install the
      # package at all — add 3.14 here once you want to support it
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package (builds from source — catches packaging bugs too)
        run: python -m pip install .
      - name: Lint (syntax errors and undefined names only)
        run: |
          python -m pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run the test suite
        run: python testing.py